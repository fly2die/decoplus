plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = '1.0'
base.archivesName = "modid"

loom {
    if (file("src/main/resources/META-INF/decoplus.classtweaker").exists())
        accessWidenerPath = file("src/main/resources/META-INF/decoplus.classtweaker")
}

dependencies {
    minecraft "com.mojang:minecraft:26.3"
    implementation "net.fabricmc:fabric-loader:0.19.5"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:0.162.0+26.3"
}

// We need to do this because MCreator doesn't allow to split armor textures in multiple folders
tasks.named('processResources', ProcessResources) {
    doLast {
        copy {
            from(layout.buildDirectory.dir("resources/main/assets/decoplus/textures/entity/equipment/humanoid"))
            into(layout.buildDirectory.dir("resources/main/assets/decoplus/textures/entity/equipment/humanoid_leggings"))
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

apply from: 'mcreator.gradle'